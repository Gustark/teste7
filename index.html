<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventário EGESP</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f1f5f9;
    padding:30px;
    color:#1e293b;
}

.container{
    max-width:1400px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    flex-wrap:wrap;
    gap:15px;
}

.header h1{
    color:#2563eb;
}

.card{
    background:white;
    border-radius:16px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.input-group{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.input-group label{
    font-size:14px;
    font-weight:bold;
}

.input-group input,
.input-group select,
.input-group textarea{
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:14px;
}

.input-group textarea{
    min-height:90px;
    resize:vertical;
}

.actions{
    margin-top:25px;
    display:flex;
    gap:10px;
}

button{
    border:none;
    padding:12px 22px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-secondary{
    background:#e2e8f0;
}

.table-container{
    overflow:auto;
    background:white;
    border-radius:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

th{
    background:#f8fafc;
    padding:15px;
    text-align:left;
    border-bottom:1px solid #e2e8f0;
}

td{
    padding:15px;
    border-bottom:1px solid #e2e8f0;
}

tr:hover{
    background:#f8fafc;
}

.status{
    padding:5px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:bold;
}

.operacional{
    background:#dcfce7;
    color:#166534;
}

.manutencao{
    background:#fef3c7;
    color:#92400e;
}

.inativo{
    background:#fee2e2;
    color:#991b1b;
}

.search{
    margin-bottom:20px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.search input,
.search select{
    padding:12px;
    border-radius:10px;
    border:1px solid #cbd5e1;
}

.toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#0f172a;
    color:white;
    padding:14px 20px;
    border-radius:10px;
    opacity:0;
    transition:.3s;
}

.toast.show{
    opacity:1;
}

@media(max-width:700px){

    body{
        padding:15px;
    }

    .actions{
        flex-direction:column;
    }

    button{
        width:100%;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>
        <i class="fas fa-microchip"></i>
        Inventário EGESP
    </h1>

    <div>
        Total:
        <strong id="totalEquipamentos">0</strong>
    </div>
</div>

<div class="card">

    <h2 id="tituloFormulario">
        Cadastrar Equipamento
    </h2>

    <br>

    <div class="form-grid">

        <div class="input-group">
            <label>Nome *</label>
            <input type="text" id="nome">
        </div>

        <div class="input-group">
            <label>Marca / Modelo *</label>
            <input type="text" id="marca">
        </div>

        <div class="input-group">
            <label>Número de Série *</label>
            <input type="text" id="serial">
        </div>

        <div class="input-group">
            <label>Localização *</label>

            <select id="localizacao">

                <option value="">Selecione</option>

                <option>Sala 171</option>
                <option>Sala 178</option>
                <option>Estúdio</option>
                <option>Grande Auditório</option>
                <option>Plenário</option>
                <option>Sala dos técnicos</option>
                <option>SSC - ADM</option>
                <option>Pequeno Auditório</option>
                <option>Gráfica - Copa</option>

            </select>
        </div>

        <div class="input-group">
            <label>Quantidade</label>
            <input type="number" id="quantidade" value="1">
        </div>

        <div class="input-group">
            <label>Status</label>

            <select id="status">

                <option>Operacional</option>
                <option>Manutenção</option>
                <option>Inativo</option>

            </select>
        </div>

        <div class="input-group" style="grid-column:1/-1;">
            <label>Observações</label>
            <textarea id="observacoes"></textarea>
        </div>

    </div>

    <div class="actions">

        <button class="btn-primary" onclick="salvarEquipamento()">
            <i class="fas fa-save"></i>
            Salvar
        </button>

        <button class="btn-secondary" onclick="resetarFormulario()">
            Cancelar
        </button>

    </div>

</div>

<div class="search">

    <input
        type="text"
        id="busca"
        placeholder="Buscar..."
        oninput="renderizarTabela()"
    >

    <select id="filtroStatus" onchange="renderizarTabela()">

        <option value="">Todos status</option>
        <option>Operacional</option>
        <option>Manutenção</option>
        <option>Inativo</option>

    </select>

</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>Nome</th>
<th>Marca</th>
<th>Série</th>
<th>Localização</th>
<th>Qtd</th>
<th>Status</th>
<th>Registro</th>
<th>Ações</th>

</tr>

</thead>

<tbody id="tabelaEquipamentos"></tbody>

</table>

</div>

</div>

<div id="toast" class="toast"></div>

<script>

const URL_WEB_APP =
"https://script.google.com/macros/s/AKfycbz5YQfgLZdyIbvry8uiTS40kF1-ykp26qmMwGql6LnuibCBqrdyGCoEV1B4xE9DcIy7CA/exec";

let equipamentos = [];

let editandoId = null;

// ======================================================
// TOAST
// ======================================================

function mostrarToast(texto){

    const toast = document.getElementById("toast");

    toast.innerText = texto;

    toast.classList.add("show");

    setTimeout(()=>{

        toast.classList.remove("show");

    },3000);
}

// ======================================================
// CARREGAR
// ======================================================

async function carregarEquipamentos(){

    try{

        const response = await fetch(
            URL_WEB_APP
        );

        const dados = await response.json();

        equipamentos = dados.dados || [];

        renderizarTabela();

    }catch(erro){

        console.error(erro);

        mostrarToast("Erro ao carregar");
    }
}

// ======================================================
// RENDER
// ======================================================

function renderizarTabela(){

    const tbody =
    document.getElementById("tabelaEquipamentos");

    const busca =
    document.getElementById("busca")
    .value
    .toLowerCase();

    const filtroStatus =
    document.getElementById("filtroStatus")
    .value;

    let lista = equipamentos.filter(eq=>{

        const matchBusca =

            eq.nome.toLowerCase().includes(busca) ||
            eq.marca.toLowerCase().includes(busca) ||
            eq.serial.toLowerCase().includes(busca);

        const matchStatus =

            !filtroStatus ||
            eq.status === filtroStatus;

        return matchBusca && matchStatus;
    });

    document.getElementById(
        "totalEquipamentos"
    ).innerText = lista.length;

    if(!lista.length){

        tbody.innerHTML = `
        <tr>
            <td colspan="8">
                Nenhum equipamento
            </td>
        </tr>
        `;

        return;
    }

    let html = "";

    lista.forEach(eq=>{

        let statusClass = "operacional";

        if(eq.status === "Manutenção"){
            statusClass = "manutencao";
        }

        if(eq.status === "Inativo"){
            statusClass = "inativo";
        }

        html += `

        <tr>

            <td>${eq.nome}</td>

            <td>${eq.marca}</td>

            <td>${eq.serial}</td>

            <td>${eq.localizacao}</td>

            <td>${eq.quantidade}</td>

            <td>
                <span class="status ${statusClass}">
                    ${eq.status}
                </span>
            </td>

            <td>${eq.registro}</td>

            <td>

                <button
                    class="btn-primary"
                    onclick="editarEquipamento('${eq.id}')"
                >
                    <i class="fas fa-edit"></i>
                </button>

                <button
                    class="btn-danger"
                    onclick="excluirEquipamento('${eq.id}')"
                >
                    <i class="fas fa-trash"></i>
                </button>

            </td>

        </tr>

        `;
    });

    tbody.innerHTML = html;
}

// ======================================================
// SALVAR
// ======================================================

async function salvarEquipamento(){

    const nome =
    document.getElementById("nome").value.trim();

    const marca =
    document.getElementById("marca").value.trim();

    const serial =
    document.getElementById("serial").value.trim();

    const localizacao =
    document.getElementById("localizacao").value;

    const quantidade =
    document.getElementById("quantidade").value;

    const status =
    document.getElementById("status").value;

    const observacoes =
    document.getElementById("observacoes").value;

    if(
        !nome ||
        !marca ||
        !serial ||
        !localizacao
    ){
        alert("Preencha os campos obrigatórios");
        return;
    }

    const params = new URLSearchParams();

    params.append(
        "acao",
        editandoId ? "editar" : "salvar"
    );

    if(editandoId){

        params.append("id", editandoId);
    }

    params.append("nome", nome);
    params.append("marca", marca);
    params.append("serial", serial);
    params.append("localizacao", localizacao);
    params.append("quantidade", quantidade);
    params.append("status", status);
    params.append("observacoes", observacoes);

    try{

        const response = await fetch(

            URL_WEB_APP +
            "?" +
            params.toString()

        );

        const resultado =
        await response.json();

        if(resultado.status !== "sucesso"){

            throw new Error(resultado.mensagem);
        }

        mostrarToast("Salvo com sucesso");

        resetarFormulario();

        carregarEquipamentos();

    }catch(erro){

        console.error(erro);

        mostrarToast("Erro ao salvar");
    }
}

// ======================================================
// EDITAR
// ======================================================

function editarEquipamento(id){

    const eq = equipamentos.find(
        item => item.id === id
    );

    if(!eq) return;

    editandoId = id;

    document.getElementById("nome").value =
    eq.nome;

    document.getElementById("marca").value =
    eq.marca;

    document.getElementById("serial").value =
    eq.serial;

    document.getElementById("localizacao").value =
    eq.localizacao;

    document.getElementById("quantidade").value =
    eq.quantidade;

    document.getElementById("status").value =
    eq.status;

    document.getElementById("observacoes").value =
    eq.observacoes;

    document.getElementById(
        "tituloFormulario"
    ).innerText = "Editar Equipamento";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

// ======================================================
// EXCLUIR
// ======================================================

async function excluirEquipamento(id){

    const confirmar =
    confirm("Deseja excluir?");

    if(!confirmar) return;

    try{

        const response = await fetch(

            URL_WEB_APP +
            "?acao=excluir&id=" +
            id

        );

        const resultado =
        await response.json();

        if(resultado.status !== "sucesso"){

            throw new Error(resultado.mensagem);
        }

        mostrarToast("Excluído");

        carregarEquipamentos();

    }catch(erro){

        console.error(erro);

        mostrarToast("Erro ao excluir");
    }
}

// ======================================================
// RESET
// ======================================================

function resetarFormulario(){

    editandoId = null;

    document.getElementById("nome").value = "";
    document.getElementById("marca").value = "";
    document.getElementById("serial").value = "";
    document.getElementById("localizacao").value = "";
    document.getElementById("quantidade").value = 1;
    document.getElementById("status").value = "Operacional";
    document.getElementById("observacoes").value = "";

    document.getElementById(
        "tituloFormulario"
    ).innerText = "Cadastrar Equipamento";
}

// ======================================================
// START
// ======================================================

carregarEquipamentos();

</script>

</body>
</html>
